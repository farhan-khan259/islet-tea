services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
  app:
    build: .
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: islet_tea
      PORT: 4000
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in your environment}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:4000}
    depends_on:
      - mongodb
volumes:
  mongo-data:
